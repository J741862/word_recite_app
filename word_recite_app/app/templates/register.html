<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>注册</title></head>
<body>
  <h2>注册新账号</h2>
  <form method="POST">
    <label>用户名：<input type="text" name="username" required></label><br>
    <label>密码：<input type="password" name="password" required></label><br>
    <button type="submit">注册</button>
  </form>
  <p>已有账号？<a href="{{ url_for('main.login') }}">登录</a></p>
</body>
</html>
