<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>My Notebook</title>
  <style>
    body { background:#f5f5f5; color:#333; font-family:Arial,sans-serif; }
    .container { width:80%; margin:40px auto; }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { padding:12px; border:1px solid #ddd; text-align:left; }
    th { background:#007bff; color:white; }
    a.btn { display:inline-block; margin:20px 0; padding:8px 16px; background:#007bff; color:white; text-decoration:none; border-radius:4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your Notebook</h1>
    <table>
      <thead>
        <tr><th>Word</th><th>Phonetic</th><th>Meaning</th></tr>
      </thead>
      <tbody>
        {% if words|length == 0 %}
        <tr><td colspan="3">Your notebook is empty.</td></tr>
        {% else %}
          {% for w in words %}
          <tr>
            <td>{{ w.word }}</td>
            <td>{{ w.phonetic or '—' }}</td>
            <td>{{ w.meaning }}</td>
          </tr>
          {% endfor %}
        {% endif %}
      </tbody>
    </table>
    <a href="{{ url_for('main.word_dictionary') }}" class="btn">← Back to Home</a>
  </div>
</body>
</html>
